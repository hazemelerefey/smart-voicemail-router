[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svr-platform"
version = "1.0.0"
description = "Smart Voicemail Router (SVR) production backend for telecom customer care"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "numpy>=1.26.4",
    "pandas>=2.1.4",
    "scikit-learn>=1.5.0",
    "faster-whisper>=1.1.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.3",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["svr_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

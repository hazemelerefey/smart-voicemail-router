<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="Smart Voicemail Router - Enterprise Telecom AI Operations Platform">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0B0B0F"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glowRedD" cx="12%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#C81D20" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C81D20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlueD" cx="82%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandRedD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E02428"/>
      <stop offset="100%" stop-color="#A81417"/>
    </linearGradient>
    <linearGradient id="waveSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="28%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="waveCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="waveRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0"/>
      <stop offset="32%" stop-color="#EF4444" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C81D20" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="gridD" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.028"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="1596" height="436" rx="22" fill="url(#bgD)" stroke="#27272A" stroke-width="2"/>
  <rect x="2" y="2" width="1596" height="436" rx="22" fill="url(#gridD)"/>
  <rect x="2" y="2" width="1596" height="436" rx="22" fill="url(#glowRedD)"/>
  <rect x="2" y="2" width="1596" height="436" rx="22" fill="url(#glowBlueD)"/>

  <!-- Right Acoustic Waveform to Routing Streams Artwork -->
  <g fill="none" stroke-linecap="round">
    <path d="M 930 220 C 1020 220, 1050 112, 1185 112 C 1310 112, 1380 112, 1540 112" stroke="url(#waveRed)" stroke-width="3.5"/>
    <path d="M 930 220 C 1030 220, 1070 146, 1210 146 C 1330 146, 1400 146, 1540 146" stroke="url(#waveRed)" stroke-width="1.5" stroke-opacity="0.45"/>

    <path d="M 910 220 C 1030 220, 1080 220, 1220 220 C 1340 220, 1410 220, 1540 220" stroke="url(#waveSky)" stroke-width="4.5"/>
    <path d="M 950 220 C 1050 202, 1130 238, 1250 220 C 1360 206, 1440 228, 1540 220" stroke="url(#waveSky)" stroke-width="1.6" stroke-opacity="0.5"/>

    <path d="M 930 220 C 1020 220, 1050 328, 1185 328 C 1310 328, 1380 328, 1540 328" stroke="url(#waveCyan)" stroke-width="3.5"/>
    <path d="M 930 220 C 1030 220, 1070 294, 1210 294 C 1330 294, 1400 294, 1540 294" stroke="url(#waveCyan)" stroke-width="1.5" stroke-opacity="0.45"/>
  </g>

  <!-- Equalizer Acoustic Bars on Right Entry -->
  <g transform="translate(888, 174)" fill="#38BDF8">
    <rect x="0" y="34" width="5" height="24" rx="2.5" opacity="0.45"/>
    <rect x="11" y="20" width="5" height="52" rx="2.5" opacity="0.65"/>
    <rect x="22" y="6" width="5" height="80" rx="2.5" opacity="0.9"/>
    <rect x="33" y="16" width="5" height="60" rx="2.5" opacity="0.75"/>
    <rect x="44" y="28" width="5" height="36" rx="2.5" opacity="0.55"/>
  </g>

  <!-- Minimalist Routing Destination Chips (No Status Dots) -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(1310, 92)">
      <rect width="204" height="40" rx="10" fill="#121216" stroke="#27272A"/>
      <rect x="0" y="8" width="4" height="24" rx="2" fill="#EF4444"/>
      <text x="18" y="25" fill="#F4F4F5">Urgent Escalation</text>
    </g>
    <g transform="translate(1310, 200)">
      <rect width="204" height="40" rx="10" fill="#121216" stroke="#27272A"/>
      <rect x="0" y="8" width="4" height="24" rx="2" fill="#38BDF8"/>
      <text x="18" y="25" fill="#F4F4F5">Network &amp; Billing</text>
    </g>
    <g transform="translate(1310, 308)">
      <rect width="204" height="40" rx="10" fill="#121216" stroke="#27272A"/>
      <rect x="0" y="8" width="4" height="24" rx="2" fill="#22D3EE"/>
      <text x="18" y="25" fill="#F4F4F5">Subscriber Care</text>
    </g>
  </g>

  <!-- SVR Brand Mark -->
  <g transform="translate(84, 84)">
    <rect x="0" y="0" width="74" height="74" rx="18" fill="url(#brandRedD)" stroke="#FF6B6E" stroke-opacity="0.32" stroke-width="1.5"/>
    <path d="M18 41 C18 24 56 24 56 41" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
    <rect x="15" y="38" width="7" height="15" rx="3.5" fill="#FFFFFF"/>
    <rect x="52" y="38" width="7" height="15" rx="3.5" fill="#FFFFFF"/>
    <line x1="29" y1="37" x2="29" y2="49" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="37" y1="32" x2="37" y2="54" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="45" y1="38" x2="45" y2="48" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Clean Eyebrow Label (Zero Dots) -->
  <text x="180" y="128" fill="#71717A" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2.2">ENTERPRISE TELECOM AI OPERATIONS</text>

  <!-- Main Product Title -->
  <text x="84" y="232" fill="#FAFAFA" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.6">Smart Voicemail Router</text>

  <!-- Subtitle -->
  <text x="84" y="278" fill="#A1A1AA" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20.5" font-weight="400">Self-hosted Egyptian Arabic voicemail triage, deterministic priority scoring,</text>
  <text x="84" y="308" fill="#A1A1AA" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20.5" font-weight="400">and skill-based callback routing for telecom customer care.</text>

  <!-- Clean Spec Footer Line (Zero Dots) -->
  <text x="84" y="370" fill="#D4D4D8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.4">Whisper large-v3   |   4x MARBERTv2   |   0.7941 Macro-F1   |   89.3% Routing Match   |   Fernet Encrypted</text>
</svg>

# SVR Prometheus Configuration (PRD Section 11.1, AI10, NFR20)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: svr-telecom-care

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: svr-backend
    metrics_path: /api/metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - backend:8000
        labels:
          component: api-and-pipeline

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

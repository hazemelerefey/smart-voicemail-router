name: SVR CI Pipeline

on:
  push:
    branches:
      - main
      - smart-voicemail-router
      - hazem/svr-production-build
  pull_request:
    branches:
      - main
      - smart-voicemail-router
      - hazem/svr-production-build

concurrency:
  group: svr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests, Security & Quality Guards
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      SVR_ENV: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system audio tools (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r backend/requirements.txt pip-audit
          pip install --no-deps -e backend

      - name: Static guard - zero em/en dashes and zero empty except blocks
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          roots = [
              pathlib.Path("backend"),
              pathlib.Path("frontend/src"),
              pathlib.Path("ops"),
              pathlib.Path("docs"),
              pathlib.Path(".github/workflows"),
              pathlib.Path("docker-compose.yml"),
          ]
          text_exts = {".py", ".ts", ".tsx", ".css", ".json", ".yml", ".yaml", ".md", ""}
          dash_hits = []
          empty_except_hits = []

          def iter_files():
              for root in roots:
                  if root.is_file():
                      yield root
                  elif root.is_dir():
                      for p in root.rglob("*"):
                          if not p.is_file():
                              continue
                          parts = set(p.parts)
                          if parts & {".next", "node_modules", "__pycache__", ".pytest_cache"}:
                              continue
                          if p.suffix.lower() in text_exts or p.name == "Dockerfile":
                              yield p

          for path in iter_files():
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "\u2014" in content or "\u2013" in content:
                  dash_hits.append(str(path))
              if path.suffix == ".py":
                  tree = ast.parse(content, filename=str(path))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ExceptHandler):
                          if len(node.body) == 1 and isinstance(node.body[0], ast.Pass):
                              empty_except_hits.append(f"{path}:{node.lineno}")

          if dash_hits:
              print("Em/en dash found in:", dash_hits, file=sys.stderr)
              sys.exit(1)
          if empty_except_hits:
              print("Empty except pass block found in:", empty_except_hits, file=sys.stderr)
              sys.exit(1)
          print("Static guard passed: 0 em/en dashes, 0 empty except blocks.")
          PY

      - name: Run backend and harness pytest suite
        run: |
          pytest backend/tests infra/tests -v

      - name: Run pip-audit dependency vulnerability scan
        run: |
          pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend Typecheck, Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Frontend static security check
        run: |
          node - <<'JS'
          const fs = require("fs");
          const path = require("path");

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else if (/\.(ts|tsx|js|jsx|css)$/.test(entry.name)) out.push(full);
            }
            return out;
          }

          const files = walk(path.join(process.cwd(), "src"));
          const issues = [];
          for (const file of files) {
            const text = fs.readFileSync(file, "utf8");
            if (text.includes("dangerouslySetInnerHTML")) {
              issues.push(`dangerouslySetInnerHTML in ${file}`);
            }
            if (/(localStorage|sessionStorage)\.(setItem|getItem)\s*\(\s*['"][^'"]*(token|session|auth|jwt|csrf)/i.test(text)) {
              issues.push(`Storage auth token usage in ${file}`);
            }
            if (/\u2014|\u2013/.test(text)) {
              issues.push(`Em/en dash in ${file}`);
            }
          }
          if (issues.length > 0) {
            console.error(issues.join("\n"));
            process.exit(1);
          }
          console.log(`Frontend static security check passed (${files.length} files scanned).`);
          JS

      - name: Run npm audit
        run: npm audit --audit-level=high

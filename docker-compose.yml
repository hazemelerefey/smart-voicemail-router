# Smart Voicemail Router (SVR) - Production Docker Compose Stack
# Matches SVR-PRD-02 Section 11.1, D8, NFR9, NFR20, NFR21, NFR22.
#
# Supply real production secrets via .env or an external secret manager.
# Never commit real passwords or cryptographic keys to version control.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svr}
      POSTGRES_USER: ${POSTGRES_USER:-svr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    volumes:
      - svr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svr} -d ${POSTGRES_DB:-svr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - svr_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - svr_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - svr_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SVR_ENV: ${SVR_ENV:-production}
      SVR_ORG_NAME: ${SVR_ORG_NAME:-Egypt Telecom Care}
      SVR_ORG_SLUG: ${SVR_ORG_SLUG:-egypt-telecom-care}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-svr}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-svr}
      REDIS_URL: redis://redis:6379/0
      SVR_SECRET_KEY: ${SVR_SECRET_KEY:-replace-with-32-byte-random-secret}
      SVR_ENCRYPTION_KEY: ${SVR_ENCRYPTION_KEY:-replace-with-url-safe-base64-fernet-key}
      SVR_BOOTSTRAP_PASSWORD: ${SVR_BOOTSTRAP_PASSWORD:-ChangeMeTelecom2026!}
      SVR_COOKIE_SECURE: ${SVR_COOKIE_SECURE:-true}
      SVR_TRUST_PROXY: ${SVR_TRUST_PROXY:-true}
      SVR_CORS_ORIGINS: ${SVR_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SVR_STORAGE_DIR: /data/storage
      SVR_MODELS_DIR: /data/models/marbertv2-single-task
      WHISPER_MODEL_ID: ${WHISPER_MODEL_ID:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      HF_HOME: /data/cache/huggingface
      TORCH_HOME: /data/cache/torch
    volumes:
      - svr_storage:/data/storage
      - ./models:/data/models:ro
      - svr_model_cache:/data/cache
    ports:
      - "${SVR_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - svr_internal

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    command: ["python", "/app/ops/worker_runner.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      SVR_ENV: ${SVR_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-svr}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-svr}
      REDIS_URL: redis://redis:6379/0
      SVR_SECRET_KEY: ${SVR_SECRET_KEY:-replace-with-32-byte-random-secret}
      SVR_ENCRYPTION_KEY: ${SVR_ENCRYPTION_KEY:-replace-with-url-safe-base64-fernet-key}
      SVR_STORAGE_DIR: /data/storage
      SVR_MODELS_DIR: /data/models/marbertv2-single-task
      WHISPER_MODEL_ID: ${WHISPER_MODEL_ID:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      HF_HOME: /data/cache/huggingface
      TORCH_HOME: /data/cache/torch
    volumes:
      - svr_storage:/data/storage
      - ./models:/data/models:ro
      - svr_model_cache:/data/cache
    deploy:
      replicas: ${SVR_WORKER_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; r = redis.Redis.from_url(os.environ['REDIS_URL']); r.ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - svr_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SVR_API_UPSTREAM: http://backend:8000
        NEXT_PUBLIC_API_BASE: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SVR_API_UPSTREAM: http://backend:8000
      NEXT_PUBLIC_API_BASE: ""
    ports:
      - "${SVR_FRONTEND_PORT:-3000}:3000"
    networks:
      - svr_internal

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - svr_promdata:/prometheus
    ports:
      - "${SVR_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - svr_internal

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana-datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./ops/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/svr.yml:ro
      - ./ops/grafana-dashboard.json:/var/lib/grafana/dashboards/svr-overview.json:ro
      - svr_grafanadata:/var/lib/grafana
    ports:
      - "${SVR_GRAFANA_PORT:-3001}:3000"
    networks:
      - svr_internal

volumes:
  svr_pgdata:
  svr_redisdata:
  svr_storage:
  svr_model_cache:
  svr_promdata:
  svr_grafanadata:

networks:
  svr_internal:
    driver: bridge
